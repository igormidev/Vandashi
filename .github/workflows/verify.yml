name: Verify and build desktop apps

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  ONNXRUNTIME_NODE_INSTALL: skip

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Restore verified source downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/native-source-cache
          key: native-sources-${{ hashFiles('scripts/native-sources.lock.json') }}
      - name: Collect original native source material
        run: npm run sources:generate
      - name: Verify every archived source payload
        run: npm run sources:verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Vandashi-native-sources
          path: |
            build/native-sources/*.tar.gz
            build/native-sources/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  desktop:
    needs: native-sources
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      HYPERFRAMES_NO_TELEMETRY: '1'
      HYPERFRAMES_NO_UPDATE_CHECK: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install macOS media test tools
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Install Windows media test tools
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install Linux media and display test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg xvfb
      - run: npm ci
      - name: Install Linux browser runtime libraries
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Check source coverage for installed native components
        run: npm run sources:check
      - name: Verify architecture, types, lint, tests, and build
        run: npm run check
      - name: Test the real Electron renderer
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Allow only the test Electron binary to create its Linux sandbox
        if: runner.os == 'Linux'
        run: node scripts/prepare-linux-sandbox.mjs node_modules/electron/dist/electron
      - name: Test the real Electron renderer on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Generate third-party license notices
        run: npm run licenses:generate
      - name: Package the desktop app
        run: npx electron-builder --publish never
      - name: Restore pinned rendering browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release/smoke-cache/browser
          key: packaged-browser-${{ runner.os }}-${{ runner.arch }}-152.0.7977.30
      - name: Restore speech model files for checksum verification
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release/smoke-cache/models
          key: speech-model-${{ runner.os }}-${{ hashFiles('src/infrastructure/media/speech-model.json') }}
      - name: Prepare the packaged runtime and exact media tool paths
        run: node scripts/prepare-packaged-smoke.mjs
      - name: Inspect the actual AppImage launcher and select its extracted runtime
        if: runner.os == 'Linux'
        run: node scripts/prepare-linux-package.mjs
      - name: Allow only the extracted app binary to create its Linux sandbox
        if: runner.os == 'Linux'
        run: node scripts/prepare-linux-sandbox.mjs "$VANDASHI_PACKAGED_APP"
      - name: Verify packaged Studio, render, and local speech without an account
        if: runner.os != 'Linux'
        run: npx vitest run tests/media-package.test.ts tests/media-speech-package.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=test-results/packaged-smoke.json
      - name: Verify packaged Studio, render, and local speech on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx vitest run tests/media-package.test.ts tests/media-speech-package.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=test-results/packaged-smoke.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Vandashi-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
      - name: Save test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ runner.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
