name: Verify and publish landing page

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: site-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify formatting, strict types, accessibility lint, and import boundaries
        run: npm run format:check && npm run typecheck && npm run lint && npm run architecture
      - name: Install browser engines and their system dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify language selection and content contracts
        run: npx vitest run tests/landing-language.test.ts tests/landing-catalogs.test.ts
      - name: Build and test the production site in all three browser engines
        run: npm run test:site
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: landing-browser-diagnostics
          path: |
            test-results/site/
            playwright-report/site/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the tested Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/landing

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish the verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
